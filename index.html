<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#52213f" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="R Skisse" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="icon" href="/assets/icons/app-icon-rskisse.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/fix.css" />
    <link rel="stylesheet" href="css/editor.css" />
    <link rel="stylesheet" href="css/polish.css" />
    <link rel="stylesheet" href="css/finish.css" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/brand.css" />
    <link rel="stylesheet" href="css/sticky.css" />
    <link rel="stylesheet" href="css/home-layout.css" />
    <link rel="stylesheet" href="css/mail-send.css" />
    <link rel="stylesheet" href="css/zip-mail.css" />
    <title>R Skisse</title>
  </head>
  <body>
    <main id="app">
      <section id="startView" class="start-view">
        <div class="colour-orbits" aria-hidden="true"></div>
        <div class="ambient-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="start-actions">
          <button id="openImageSource" class="primary-button upload-button" aria-label="Velg bilde"></button>
          <input id="imageUpload" type="file" accept="image/*" hidden />
          <input id="cameraUpload" type="file" accept="image/*" capture="environment" hidden />
        </div>
        <div class="edge-tint" aria-hidden="true"></div>
        <span class="brand-skisse" aria-hidden="true">Skisse</span>
        <div id="imageSourceDialog" class="image-source-dialog hidden" role="dialog" aria-modal="true" aria-label="Velg bilde">
          <div class="image-source-card">
            <label for="cameraUpload" class="source-choice">Ta bilde</label>
            <label for="imageUpload" class="source-choice">Velg bilde</label>
          </div>
        </div>
        <span class="app-version">v1.8.53</span>
        <span class="developer-credit">Ulrik Ruud</span>
        <button id="accessLogout" class="access-logout" type="button" aria-label="Logg ut">Logg ut</button>
      </section>

      <section id="cameraView" class="camera-view hidden">
        <video id="camera" autoplay playsinline muted></video>
        <div class="camera-top"><button class="icon-button" id="closeCamera" aria-label="Lukk kamera">×</button><span>Ta bilde</span></div>
        <div class="camera-bottom"><button id="takePhoto" class="shutter" aria-label="Ta bilde"><i></i></button></div>
      </section>

      <section id="editorView" class="editor-view hidden">
        <div class="colour-orbits" aria-hidden="true"></div>
        <div class="ambient-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div id="canvasWrap" class="canvas-wrap">
          <canvas id="photoCanvas"></canvas><canvas id="drawCanvas"></canvas><div id="textLayer"></div>
          <div class="editor-top-controls"><button class="floating-button discard-button" id="discardSketch" aria-label="Forkast skisse">&times;</button><button class="floating-button undo-button" id="undo" aria-label="Angre"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7 4 12l5 5M4 12h10a6 6 0 1 1 0 12"/></svg></button></div>
          <div class="pen-colors" id="penColors">
            <div class="pen-widths" role="group" aria-label="Velg tegnetykkelse"><button class="pen-width" data-width="1" style="--line-size:10px" aria-label="Tynn"></button><button class="pen-width" data-width="1.45" style="--line-size:14px" aria-label="Liten"></button><button class="pen-width selected" data-width="1.95" style="--line-size:18px" aria-label="Standard"></button><button class="pen-width" data-width="2.45" style="--line-size:22px" aria-label="Tykk"></button><button class="pen-width" data-width="2.95" style="--line-size:26px" aria-label="Ekstra tykk"></button></div>
            <div class="pen-palette" role="group" aria-label="Velg farge"><button class="color selected" data-color="#ef4444" style="--swatch:#ef4444" aria-label="Rød"></button><button class="color" data-color="#f59e0b" style="--swatch:#f59e0b" aria-label="Gul"></button><button class="color" data-color="#22c55e" style="--swatch:#22c55e" aria-label="Grønn"></button><button class="color" data-color="#2563eb" style="--swatch:#2563eb" aria-label="Blå"></button><button class="color" data-color="#ffffff" style="--swatch:#ffffff" aria-label="Hvit"></button></div>
          </div>
          <div class="text-colors" id="textColors" role="group" aria-label="Velg tekstfarge"><button class="text-color selected" data-color="#ef4444" style="--swatch:#ef4444"></button><button class="text-color" data-color="#f59e0b" style="--swatch:#f59e0b"></button><button class="text-color" data-color="#22c55e" style="--swatch:#22c55e"></button><button class="text-color" data-color="#2563eb" style="--swatch:#2563eb"></button><button class="text-color" data-color="#ffffff" style="--swatch:#ffffff"></button></div>
          <div class="editor-bottom-controls"><button class="floating-button tool-button" id="penTool" aria-label="Tegn med penn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 20 4.2-1 10.4-10.4a2.8 2.8 0 0 0-4-4L4.2 15zM13.2 6l4.8 4.8"/></svg></button><button class="floating-button tool-button convert-button" id="recognizeTool" aria-label="Legg til tekst">T</button></div>
        </div>
      </section>

      <section id="finishView" class="finish-view hidden">
        <div class="colour-orbits" aria-hidden="true"></div>
        <div class="ambient-stars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="finish-edge-tint" aria-hidden="true"></div>
        <span class="finish-skisse" aria-hidden="true">Skisse</span>
        <div id="finishImageSourceDialog" class="image-source-dialog finish-image-source-dialog hidden" role="dialog" aria-modal="true" aria-label="Velg bilde">
          <div class="image-source-card">
            <label for="cameraUpload" class="source-choice">Ta bilde</label>
            <label for="imageUpload" class="source-choice">Velg bilde</label>
          </div>
        </div>
        <div class="finish-gallery-shell" aria-label="Ferdige skisser">
          <div class="finish-title-wrap"><input id="projectTitle" class="project-title" type="text" placeholder="Sett inn tittel..." autocomplete="off" aria-label="Felles tittel for filnavn" /></div>
          <div id="sketchGrid" class="sketch-grid"></div>
        </div>
        <div class="finish-brand"><img src="assets/brand/rumag-logo-hvit.svg" alt="RUMAG" /></div>
        <div class="finish-icon">✓</div><h1>Skissen er klar</h1><p>Del den med Outlook, Teams eller en annen app – eller lagre den for senere.</p>
        <div class="finish-actions"><button id="shareImage" class="primary-button share-button">Lagre skisse</button><button id="downloadImage" class="secondary-button save-button">Send på mail</button></div>
        <button id="deleteSketch" class="delete-button">Slett skisse</button>
      </section>
    </main>
    <div id="mailDialog" class="mail-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="mailDialogTitle">
      <section class="mail-card">
        <header class="mail-header"><div><span class="mail-kicker">R SKISSE</span><h2 id="mailDialogTitle">Send på mail</h2></div><button id="closeMailDialog" class="mail-close" type="button" aria-label="Lukk">&times;</button></header>
        <div class="mail-section"><span class="mail-label">Mottaker</span><div id="mailRecipients" class="mail-recipients" role="group" aria-label="Velg mottaker"></div></div>
        <div class="mail-section"><span class="mail-label">Vedlegg</span><div id="mailFiles" class="mail-files"></div></div>
        <label class="mail-section mail-note-label"><span class="mail-label">Notat</span><textarea id="mailNote" rows="4" placeholder="Kunde, prosjekt eller ekstra informasjon..."></textarea></label>
        <button id="sendMailButton" class="mail-send" type="button" disabled>Velg mottaker</button>
      </section>
    </div>
    <div id="sentSketchDialog" class="mail-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="sentSketchDialogTitle">
      <section class="mail-card sent-sketch-card">
        <span class="mail-kicker sent-success">Sendt!</span>
        <h2 id="sentSketchDialogTitle">Vil du forkaste skissene?</h2>
        <div class="sent-sketch-actions"><button id="discardSentSketches" class="sent-sketch-discard" type="button">Ja</button><button id="keepSentSketches" class="sent-sketch-cancel" type="button">Avbryt</button></div>
      </section>
    </div>
    <div id="toast" role="status"></div>
    <script src="js/app.js"></script><script src="js/pdf-export.js"></script><script src="js/finish.js"></script><script src="js/editor-flow.js"></script><script src="js/finish-gallery.js"></script><script src="js/mail-send.js"></script>
  </body>
</html>
